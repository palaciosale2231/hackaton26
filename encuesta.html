<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Evaluador de Prevención</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Estilos propios -->
    <link rel="stylesheet" href="assets/encuesta.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="container nav-flex">
        <div class="logo">Vectra</div>

        <div class="nav-links">
          <a href="inicio.html" class="active">Inicio</a>

          <a href="enfermedades.html" class="link-companero"> Enfermedades </a>
          <a href="encuesta.html" class="link-companero"> Encuesta </a>
          <a href="prevencion.html" class="link-companero"> Prevención </a>
          <a href="centrosalud.html" class="link-companero"> Hospitales </a>

          <button
            id="modoOscuro"
            class="dark-mode-btn"
            type="button"
            aria-label="Activar modo oscuro"
          >
            🌙
          </button>
        </div>
      </div>
    </nav>

    <!-- ENCUESTA -->
    <main class="encuesta-container">
      <div class="encuesta-card">
        <div class="titulo">
          <h1>Evaluador de prevención</h1>

          <p class="text-muted">
            Respondé las preguntas para conocer qué medidas de prevención
            aplicás en tu hogar.
          </p>
        </div>

        <!-- Información del progreso -->
        <div class="progreso-info">
          <span id="numeroPregunta">Pregunta 1 de 15</span>
          <span id="preguntasRestantes">Te faltan 14</span>
        </div>

        <!-- Barra de progreso -->
        <div class="progress">
          <div
            id="barraProgreso"
            class="progress-bar"
            role="progressbar"
            style="width: 0%"
          ></div>
        </div>

        <!-- Pregunta -->
        <div class="pregunta">
          <h2 id="textoPregunta"></h2>
        </div>

        <!-- Opciones -->
        <div id="opciones" class="opciones"></div>

        <!-- Botones -->
        <div class="botones">
          <button
            type="button"
            id="btnAnterior"
            class="btn btn-outline-secondary"
            hidden
          >
            ← Anterior
          </button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>© GAM dev — Módulo de Introducción y Concientización Comunitaria.</p>
    </footer>

    <script src="js/encuesta.js"></script>
    <script src="js/modo-oscuro.js"></script>
  </body>
</html>
