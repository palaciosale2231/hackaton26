<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Evaluador de Prevención</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Estilos propios -->
    <link rel="stylesheet" href="assets/encuesta.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="nav-container">
        <div class="logo">MosquiInfo</div>

        <div class="nav-links">
          <a href="#ciclo">Ciclo Biológico</a>
          <a href="#sintomas">Triage</a>
          <a href="#reportar">Reportar Barrio</a>
        </div>
      </div>
    </nav>

    <!-- ENCUESTA -->
    <main class="encuesta-container">
      <div class="encuesta-card">
        <div class="titulo">
          <h1>Evaluador de prevención</h1>
          <p class="text-muted">
            Respondé las preguntas para conocer qué medidas de prevención
            aplicás en tu hogar.
          </p>
        </div>

        <!-- Información del progreso -->
        <div class="progreso-info">
          <span id="numeroPregunta">Pregunta 1 de 10</span>
          <span id="preguntasRestantes">Te faltan 9</span>
        </div>

        <!-- Barra de progreso -->
        <div class="progress">
          <div
            id="barraProgreso"
            class="progress-bar"
            role="progressbar"
            style="width: 0%"
          ></div>
        </div>

        <!-- Pregunta -->
        <div class="pregunta">
          <h2 id="textoPregunta"></h2>
        </div>

        <!-- Opciones -->
        <div id="opciones" class="opciones"></div>

        <!-- Botones (Solo Anterior, oculto en la pregunta 1) -->
        <div class="botones">
          <button
            type="button"
            id="btnAnterior"
            class="btn btn-outline-secondary"
            hidden
          >
            ← Anterior
          </button>
        </div>
      </div>
    </main>

    <!-- Script en la raíz -->
    <script src="encuesta.js"></script>
  </body>
</html>
