<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Evaluador de Prevención</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/encuesta.css" />
  </head>

  <body>
    <main class="encuesta-container">
      <div class="encuesta-card">
        <div class="titulo">
          <h1>Evaluador de prevención</h1>
          <p class="text-muted">
            Respondé las preguntas para conocer qué medidas de prevención
            aplicás en tu hogar.
          </p>
        </div>

        <!-- Información del progreso -->
        <div class="progreso-info">
          <span id="numeroPregunta">Pregunta 1 de 10</span>
          <span id="preguntasRestantes">Te faltan 9</span>
        </div>

        <!-- Barra de progreso -->
        <div class="progress">
          <div
            id="barraProgreso"
            class="progress-bar"
            role="progressbar"
            style="width: 0%"
          ></div>
        </div>

        <!-- Pregunta -->
        <div class="pregunta">
          <h2 id="textoPregunta"></h2>
        </div>

        <!-- Opciones -->
        <div id="opciones" class="opciones"></div>

        <!-- Botones -->
        <div class="botones">
          <button
            type="button"
            id="btnAnterior"
            class="btn btn-outline-secondary"
          >
            ← Anterior
          </button>

          <button
            type="button"
            id="btnContinuar"
            class="btn btn-primary"
            disabled
          >
            Continuar →
          </button>
        </div>
      </div>
    </main>

    <script src="encuesta.js"></script>
  </body>
</html>
