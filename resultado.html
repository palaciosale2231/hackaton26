<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Resultado de prevención</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <main class="container py-5">
      <div class="text-center">
        <h1 class="mb-4">Resultado de tu evaluación</h1>

        <div id="resultado" class="p-4 rounded mb-4">
          <h2 id="porcentaje"></h2>
          <p id="mensaje"></p>
        </div>
      </div>

      <section>
        <h3>Aspectos que podrías mejorar</h3>

        <div id="recomendaciones"></div>
      </section>

      <div class="text-center mt-5">
        <p>
          ¿Querés conocer más sobre cómo prevenir la proliferación de mosquitos?
        </p>

        <a href="prevencion.html" class="btn btn-primary">
          Ver recomendaciones de prevención
        </a>
      </div>

      <div class="text-center mt-3">
        <a href="encuesta.html" class="btn btn-outline-secondary">
          Volver a realizar la evaluación
        </a>
      </div>
    </main>

    <script>
      const porcentaje = Number(localStorage.getItem("porcentajePrevencion"));

      const recomendaciones =
        JSON.parse(localStorage.getItem("recomendaciones")) || [];

      const porcentajeElemento = document.getElementById("porcentaje");

      const mensajeElemento = document.getElementById("mensaje");

      const resultadoElemento = document.getElementById("resultado");

      const recomendacionesElemento =
        document.getElementById("recomendaciones");

      porcentajeElemento.textContent = porcentaje + "%";

      if (porcentaje >= 80) {
        resultadoElemento.classList.add("bg-success", "text-white");

        mensajeElemento.textContent =
          "¡Vas por buen camino! Seguí manteniendo tus hábitos preventivos.";
      } else if (porcentaje >= 60) {
        resultadoElemento.classList.add("bg-warning");

        mensajeElemento.textContent =
          "Tu nivel de prevención es moderado. Hay algunas medidas que podrías mejorar.";
      } else {
        resultadoElemento.classList.add("bg-danger", "text-white");

        mensajeElemento.textContent =
          "Se identificaron varias medidas preventivas que requieren atención.";
      }

      const recomendacionesPorPregunta = {
        pregunta1: {
          titulo: "Revisión del espacio exterior",
          texto:
            "Revisá periódicamente tu patio o espacio exterior para detectar recipientes u objetos que puedan acumular agua.",
          enlace: "prevencion.html#criaderos",
        },

        pregunta2: {
          titulo: "Recipientes expuestos",
          texto:
            "Evitá que los recipientes acumulen agua de lluvia. Guardalos bajo techo, colocálos boca abajo o eliminá los que no utilices.",
          enlace: "prevencion.html#recipientes",
        },

        pregunta3: {
          titulo: "Bebederos de mascotas",
          texto:
            "Limpiá y renová frecuentemente el agua de los bebederos para evitar que puedan convertirse en criaderos.",
          enlace: "prevencion.html#mascotas",
        },

        pregunta4: {
          titulo: "Almacenamiento de agua",
          texto:
            "Mantené correctamente tapados los recipientes utilizados para almacenar agua.",
          enlace: "prevencion.html#agua",
        },

        pregunta5: {
          titulo: "Objetos que pueden acumular agua",
          texto:
            "Eliminá, guardá bajo techo o colocá boca abajo los objetos que puedan acumular agua.",
          enlace: "prevencion.html#criaderos",
        },

        pregunta6: {
          titulo: "Tanque de agua",
          texto:
            "Verificá que el tanque esté correctamente tapado para impedir el ingreso de mosquitos.",
          enlace: "prevencion.html#tanques",
        },
      };

      if (recomendaciones.length === 0) {
        recomendacionesElemento.innerHTML = `
                <div class="alert alert-success">
                    No se detectaron medidas preventivas que requieran atención.
                    ¡Seguí manteniendo estos hábitos!
                </div>
            `;
      } else {
        recomendaciones.forEach(function (nombrePregunta) {
          const recomendacion = recomendacionesPorPregunta[nombrePregunta];

          if (!recomendacion) {
            return;
          }

          const tarjeta = document.createElement("div");

          tarjeta.classList.add("alert", "alert-danger", "mb-3");

          tarjeta.innerHTML = `
                    <h5>${recomendacion.titulo}</h5>

                    <p>
                        ${recomendacion.texto}
                    </p>

                    <a href="${recomendacion.enlace}">
                        Conocé cómo prevenir esta situación →
                    </a>
                `;

          recomendacionesElemento.appendChild(tarjeta);
        });
      }
    </script>
  </body>
</html>
