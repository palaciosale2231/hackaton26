<div id="carouselRandom" class="carousel slide">
  <div class="carousel-indicators">
    <button
      type="button"
      data-bs-target="#carouselRandom"
      data-bs-slide-to="0"
      class="active"
      aria-current="true"
      aria-label="Imagen 1"
    ></button>

    <button
      type="button"
      data-bs-target="#carouselRandom"
      data-bs-slide-to="1"
      aria-label="Imagen 2"
    ></button>

    <button
      type="button"
      data-bs-target="#carouselRandom"
      data-bs-slide-to="2"
      aria-label="Imagen 3"
    ></button>
  </div>

  <div class="carousel-inner">
    <div class="carousel-item active">
      <img
        src="https://picsum.photos/600/350?random=1"
        class="d-block w-100"
        alt="Imagen aleatoria"
      />
    </div>

    <div class="carousel-item">
      <img
        src="https://picsum.photos/600/350?random=2"
        class="d-block w-100"
        alt="Imagen aleatoria"
      />
    </div>

    <div class="carousel-item">
      <img
        src="https://picsum.photos/600/350?random=3"
        class="d-block w-100"
        alt="Imagen aleatoria"
      />
    </div>
  </div>

  <button
    class="carousel-control-prev"
    type="button"
    data-bs-target="#carouselRandom"
    data-bs-slide="prev"
  >
    <span class="carousel-control-prev-icon"></span>
    <span class="visually-hidden">Anterior</span>
  </button>

  <button
    class="carousel-control-next"
    type="button"
    data-bs-target="#carouselRandom"
    data-bs-slide="next"
  >
    <span class="carousel-control-next-icon"></span>
    <span class="visually-hidden">Siguiente</span>
  </button>
</div>
